# Askloom starter file: docker-compose.yml

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      FRONTEND_URL: "http://127.0.0.1:5000,http://localhost:5000"
    env_file:
      - backend/.env

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5000:5000"
    environment:
      PORT: "5000"
      BACKEND_URL: "http://backend:8000"
    depends_on:
      - backend
